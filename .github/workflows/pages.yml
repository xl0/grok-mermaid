name: Deploy demo to GitHub Pages

# Pages serves the gh-pages branch (Settings → Pages → deploy from branch).
# A master push deploys to the site root; a push to any other branch deploys
# that branch's demo to previews/<branch>/ beside it, without touching the
# root. keep_files leaves the other deployments (and old hashed assets) in
# place — clean up gh-pages by hand if it ever bloats (delete a branch's
# previews/<slug> dir once the branch is gone).

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

# One deploy at a time across all branches: every job commits to gh-pages,
# and parallel pushes would reject each other. Queued, not cancelled, so a
# branch push can't kill a master deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      # Root deploy for master; previews/<slug> for anything else. The slug
      # flattens `/` in branch names so a preview is always one directory.
      - name: Resolve deploy target
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "base=/lovely-mermaid" >> "$GITHUB_OUTPUT"
            echo "dest=" >> "$GITHUB_OUTPUT"
          else
            slug=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'a-zA-Z0-9._-' '-')
            echo "base=/lovely-mermaid/previews/$slug" >> "$GITHUB_OUTPUT"
            echo "dest=previews/$slug" >> "$GITHUB_OUTPUT"
          fi

      # The demo is standalone (own lockfile), not a workspace member; it
      # reaches lovely-mermaid through a source alias, so no package build.
      - name: Install dependencies
        working-directory: demo
        run: bun install --frozen-lockfile

      - name: Build demo
        working-directory: demo
        env:
          BASE_PATH: ${{ steps.target.outputs.base }}
        run: bun run build

      # Pure SPA: the build emits only the 404.html fallback; every deploy
      # needs a real index.html. Pages serves ONE 404.html — the site
      # root's — so the master deploy replaces its copy with a redirector
      # that stashes the deep-linked path (app.html restores it) and
      # bounces to the right app index, previews included. Preview deploys
      # drop their 404.html: it would never be served.
      - name: Prepare SPA entry points
        run: |
          cp demo/build/404.html demo/build/index.html
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            cat > demo/build/404.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8" />
          <title>lovely-mermaid</title>
          <script>
            var m = location.pathname.match(/^(\/lovely-mermaid\/previews\/[^/]+\/)/);
            var base = m ? m[1] : '/lovely-mermaid/';
            sessionStorage.setItem('spa-path', location.pathname + location.search + location.hash);
            location.replace(base);
          </script>
          HTML
          else
            rm demo/build/404.html
          fi

      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: demo/build
          destination_dir: ${{ steps.target.outputs.dest }}
          keep_files: true
          commit_message: "deploy ${{ github.ref_name }}@${{ github.sha }}"

      # previews/index.html lists every preview present on gh-pages (read
      # after the deploy above, so the current one is included). Regenerated
      # on every run, master included, so it stays current as previews are
      # added or hand-deleted.
      - name: Build previews index
        run: |
          git fetch --depth=1 origin gh-pages
          mkdir -p previews-index
          {
            echo '<!doctype html><meta charset="utf-8"><title>lovely-mermaid previews</title>'
            echo '<style>body{font:16px/1.6 system-ui;max-width:40rem;margin:3rem auto;padding:0 1rem;background:#16161a;color:#d4d4d8}a{color:#8ab4f8}h1{font-size:1.2rem;font-weight:normal}</style>'
            echo '<h1>lovely-mermaid / previews</h1><ul>'
            { git ls-tree --name-only origin/gh-pages:previews 2>/dev/null || true; } |
              grep -v '^index\.html$' | sort |
              while read -r s; do echo "<li><a href=\"$s/\">$s</a></li>"; done
            echo '</ul><p><a href="../">← main site</a></p>'
          } > previews-index/index.html

      - uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: previews-index
          destination_dir: previews
          keep_files: true
          commit_message: "previews index"
