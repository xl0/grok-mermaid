name: Release

# `scripts/release.ts` pushes the tag; that push is the only trigger. Tags with
# a prerelease suffix (v1.2.3-rc.1) are ignored.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency: npm-publish

jobs:
  publish-npm:
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.13"

      - run: npm install --global npm@12.0.2
      - run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./packages/lovely-mermaid/package.json').version")"

      # prepublishOnly's steps, run explicitly so a failure names itself and so
      # the publish below can skip lifecycle scripts entirely. check:pkg, not
      # check: the full check chains the demo's svelte-check, and the demo is
      # not a workspace member — its deps are absent here.
      - run: bun run check:pkg
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
        working-directory: packages/lovely-mermaid

      # Skipping an already-published version is what lets a half-failed release
      # be re-run. A registry error still fails: only a 404 means "not there".
      # Staged-but-unapproved versions are invisible to `npm view`; re-running
      # then fails on the stage publish itself (versions share one index).
      - name: Stage on npm
        working-directory: packages/lovely-mermaid
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          if seen="$(npm view "lovely-mermaid@${version}" version 2>&1)"; then
            echo "lovely-mermaid@${version} is already published (${seen}); skipping."
            exit 0
          fi
          case "$seen" in
            *E404*|*"404 Not Found"*) ;;
            *) echo "::error::could not query npm for ${version}: ${seen}"; exit 1 ;;
          esac

          # Staged, not published: CI builds with OIDC provenance, but the
          # version only reaches the registry after a maintainer approves it
          # with 2FA (`npm stage approve` or npmjs.com).
          npm stage publish --access public --provenance --ignore-scripts

  github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Gated on publish-npm, so a release is only ever visible for a version
      # whose verified build was at least staged on npm. Installability still
      # waits on the manual 2FA approval.
      - name: Create the GitHub Release
        run: |
          set -euo pipefail

          awk -v want="## [${GITHUB_REF_NAME#v}]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' packages/lovely-mermaid/CHANGELOG.md > NOTES.md

          test -s NOTES.md || { echo "::error::no CHANGELOG.md section for $GITHUB_REF_NAME"; exit 1; }

          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file NOTES.md
