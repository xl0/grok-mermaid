<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// GitHub Pages serves one root 404.html for the whole site; on a
			// deep link it stashes the requested path and bounces to the app
			// index (root or a branch preview). Restore it before the router
			// boots so the SPA resolves the real route.
			(function () {
				var p = sessionStorage.getItem('spa-path');
				if (p) {
					sessionStorage.removeItem('spa-path');
					history.replaceState(null, '', p);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
